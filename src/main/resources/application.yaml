spring:
  application:
    name: hospital-management
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/hospital_management}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mongock:
  migration-scan-package:
    - com.hospital.management.migration
  transactional: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:hospital-management}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@hospital.local}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe123!}
    admin-full-name: ${SEED_ADMIN_FULL_NAME:Hospital Admin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.hospital.management: INFO
